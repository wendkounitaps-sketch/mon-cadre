<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Cadre Photo Intelligents</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    
    /* Conteneur des images */
    #slideshow { position: absolute; width: 100%; height: 100%; z-index: 1; }
    .slide {
      position: absolute; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.5s ease-in-out;
    }
    .slide.active { opacity: 1; }

    /* Overlay d'information (Météo / Horloge) */
    .overlay {
      position: absolute; bottom: 30px; left: 30px; z-index: 10;
      color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      background: rgba(0,0,0,0.3); padding: 15px 25px; backdrop-filter: blur(8px);
      border-radius: 16px;
    }
    .clock { font-size: 3.5rem; font-weight: bold; }
    .weather { font-size: 1.2rem; margin-top: 5px; opacity: 0.9; }

    /* Bouton Assistant IA */
    .ai-btn {
      position: absolute; bottom: 30px; right: 30px; z-index: 10;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
      color: white; padding: 15px 20px; border-radius: 50px; cursor: pointer;
      backdrop-filter: blur(8px); font-size: 1rem; transition: transform 0.2s;
    }
    .ai-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="slideshow"></div>

  <div class="overlay">
    <div class="clock" id="clock">00:00</div>
    <div class="weather" id="weather">Chargement météo...</div>
  </div>

  <button class="ai-btn" onclick="startAIAssistant()">🎙️ Discuter de la photo</button>

  <script>
    // 1. Liste des photos (Remplacer par vos URLs d'images ou flux API)
    const photos = [
      'https://picsum.photos/id/1018/1920/1080',
      'https://picsum.photos/id/1015/1920/1080',
      'https://picsum.photos/id/1019/1920/1080'
    ];
    let currentIndex = 0;
    const slideshow = document.getElementById('slideshow');

    // Générer les diapositives
    photos.forEach((url, i) => {
      const div = document.createElement('div');
      div.className = `slide ${i === 0 ? 'active' : ''}`;
      div.style.backgroundImage = `url('${url}')`;
      slideshow.appendChild(div);
    });

    // Rotation des photos toutes les 10 secondes
    setInterval(() => {
      const slides = document.querySelectorAll('.slide');
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
    }, 10000);

    // 2. Horloge en temps réel
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. Météo automatique (Paris par défaut, modifiable via coordonnées)
    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.8566&longitude=2.3522&current_weather=true');
        const data = await res.json();
        document.getElementById('weather').innerText = `${data.current_weather.temperature}°C • Vent: ${data.current_weather.windspeed} km/h`;
      } catch (e) {
        document.getElementById('weather').innerText = "Météo indisponible";
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000); // Mise à jour toutes les 10 min

    // 4. Maintien de l'écran allumé (Wake Lock API)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err);
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // 5. Assistant IA (Utilise la reconnaissance vocale du navigateur)
    function startAIAssistant() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("La reconnaissance vocale n'est pas supportée par ce navigateur.");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      
      alert("Écoute en cours... Posez votre question sur la photo !");
      recognition.start();

      recognition.onresult = (event) => {
        const query = event.results[0][0].transcript;
        // Ici, vous envoyez `query` et `photos[currentIndex]` à votre API OpenAI / Backend
        speakResponse(`Vous avez demandé : "${query}". Cette photo montre un paysage magnifique !`);
      };
    }

    function speakResponse(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
